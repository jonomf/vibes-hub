name: Build & deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: picks up new Pages repos automatically

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find projects
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Screenshot projects
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/screenshot.mjs

      - name: Cache-bust CSS/JS so new HTML never pairs with stale files
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
